name: Fix White5 font

on:
  push:
    branches:
      - white5-deck-fence-leads
    paths:
      - tools/fix_white5_font.py
      - .github/workflows/fix-white5-font.yml

permissions:
  contents: write

jobs:
  fix-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: white5-deck-fence-leads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Correct glyphs and kerning
        run: python tools/fix_white5_font.py

      - name: Remove one-time helper files
        run: |
          rm -f tools/fix_white5_font.py
          rm -f .github/workflows/fix-white5-font.yml
          rm -f font-preview-note.txt

      - name: Commit corrected font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct White5 glyph dots and kerning"
          git push origin HEAD:white5-deck-fence-leads
