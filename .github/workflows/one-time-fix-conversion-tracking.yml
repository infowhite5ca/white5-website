name: One-time White5 conversion tracking fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-conversion-tracking.yml'

permissions:
  contents: write

jobs:
  fix-conversion-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace false lead conversions with engagement events
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index_text = index_path.read_text(encoding='utf-8')
          index_pattern = re.compile(r"  <script>\n  function white5_report_conversion_event\(\) \{.*?</script>", re.S)
          index_replacement = "\n".join([
              "  <script>",
              "  function white5_report_conversion_event() {",
              "    gtag('event', 'estimate_interest', {'event_category': 'engagement'});",
              "  }",
              "  function gtag_report_conversion(url) {",
              "    var eventName = (typeof url === 'string' && url.indexOf('tel:') === 0) ? 'phone_click' : 'contact_click';",
              "    gtag('event', eventName, {'event_category': 'engagement'});",
              "    if (typeof(url) !== 'undefined') { window.location = url; }",
              "    return false;",
              "  }",
              "</script>",
          ])
          index_text, index_count = index_pattern.subn(index_replacement, index_text, count=1)
          if index_count != 1:
              raise SystemExit(f'Expected one index conversion helper block, found {index_count}.')
          index_path.write_text(index_text, encoding='utf-8')

          gallery_path = Path('gallery.html')
          gallery_text = gallery_path.read_text(encoding='utf-8')
          gallery_pattern = re.compile(r"  <script>\n    function white5_report_conversion_event\(\).*?  </script>", re.S)
          gallery_replacement = "\n".join([
              "  <script>",
              "    function white5_report_conversion_event(){gtag('event','estimate_interest',{'event_category':'engagement'});}",
              "    function gtag_report_conversion(url){var eventName=(typeof url==='string'&&url.indexOf('tel:')===0)?'phone_click':'contact_click';gtag('event',eventName,{'event_category':'engagement'});if(url)window.location=url;return false;}",
              "  </script>",
          ])
          gallery_text, gallery_count = gallery_pattern.subn(gallery_replacement, gallery_text, count=1)
          if gallery_count != 1:
              raise SystemExit(f'Expected one gallery conversion helper block, found {gallery_count}.')
          gallery_path.write_text(gallery_text, encoding='utf-8')

          for path in (index_path, gallery_path):
              text = path.read_text(encoding='utf-8')
              if "gtag('event', 'conversion'" in text or "gtag('event','conversion'" in text:
                  raise SystemExit(f'Google Ads conversion event still present in {path}')

      - name: Commit tracking fix
        run: |
          git config user.name "White5 Automation"
          git config user.email "info@white5.ca"
          git add index.html gallery.html
          git diff --cached --check
          git commit -m "Fix false Google Ads conversion tracking"
          git push
