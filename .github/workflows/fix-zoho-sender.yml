name: Fix Zoho sender selection

on:
  push:
    branches:
      - white5-deck-fence-leads
    paths:
      - tools/fix_zoho_sender.py
      - .github/workflows/fix-zoho-sender.yml

permissions:
  contents: write

jobs:
  fix-zoho-sender:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: white5-deck-fence-leads
          fetch-depth: 0

      - name: Apply Zoho sender fix
        run: python tools/fix_zoho_sender.py

      - name: Remove one-time helper files
        run: |
          rm -f tools/fix_zoho_sender.py
          rm -f .github/workflows/fix-zoho-sender.yml

      - name: Commit Zoho sender fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use a separate Zoho sender when available"
          git push origin HEAD:white5-deck-fence-leads
