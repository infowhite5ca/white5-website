name: Add second Google Ads tracking tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-second-google-ads-tag.yml

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add second Google Ads tag and conversion
        shell: python
        run: |
          from pathlib import Path
          import re

          OLD_ID = "AW-17206495005"
          NEW_ID = "AW-18208326566"
          OLD_SEND_TO = "AW-17206495005/4T4mCJ7N-64cEJ2O2YxA"
          NEW_SEND_TO = "AW-18208326566/BLZ_CNyjlcUcEKaHtOpD"

          OLD_INLINE = "gtag('event', 'conversion', {'send_to': 'AW-17206495005/4T4mCJ7N-64cEJ2O2YxA'});"
          EVENT_HELPER_CALL = "white5_report_conversion_event();"

          HELPER = f"""  <script>
  function white5_report_conversion_event() {{
    gtag('event', 'conversion', {{'send_to': '{OLD_SEND_TO}'}});
    gtag('event', 'conversion', {{'send_to': '{NEW_SEND_TO}'}});
  }}

  function gtag_report_conversion(url) {{
    var callback = function () {{
      if (typeof(url) !== 'undefined') {{
        window.location = url;
      }}
    }};

    gtag('event', 'conversion', {{'send_to': '{OLD_SEND_TO}'}});
    gtag('event', 'conversion', {{
      'send_to': '{NEW_SEND_TO}',
      'event_callback': callback
    }});

    return false;
  }}
</script>
"""

          HELPER_PATTERN = re.compile(r"\s*<script>\s*function\s+gtag_report_conversion\s*\(url\)\s*\{.*?return\s+false;\s*\}\s*</script>", re.S)
          HELPER_WITH_EVENT_PATTERN = re.compile(r"\s*<script>\s*function\s+white5_report_conversion_event\s*\(\)\s*\{.*?function\s+gtag_report_conversion\s*\(url\)\s*\{.*?return\s+false;\s*\}\s*</script>", re.S)

          def add_new_config(html):
            if NEW_ID in html:
              return html
            old_config = f"gtag('config', '{OLD_ID}');"
            new_config = f"gtag('config', '{OLD_ID}');\n  gtag('config', '{NEW_ID}');"
            if old_config in html:
              return html.replace(old_config, new_config, 1)
            return html

          def update_inline_events(html):
            return html.replace(OLD_INLINE, EVENT_HELPER_CALL)

          def update_helper(html):
            if 'function white5_report_conversion_event()' in html:
              return HELPER_WITH_EVENT_PATTERN.sub('\n' + HELPER, html, count=1)
            if 'function gtag_report_conversion(url)' in html:
              return HELPER_PATTERN.sub('\n' + HELPER, html, count=1)
            return html.replace('</head>', HELPER + '</head>', 1)

          changed = []
          for path in Path('.').glob('*.html'):
            original = path.read_text(encoding='utf-8')
            updated = add_new_config(original)
            updated = update_inline_events(updated)
            updated = update_helper(updated)
            if updated != original:
              path.write_text(updated, encoding='utf-8', newline='\n')
              changed.append(str(path))

          workflow = Path('.github/workflows/add-second-google-ads-tag.yml')
          if workflow.exists():
            workflow.unlink()
            changed.append(str(workflow))

          print('Changed files:', ', '.join(changed) if changed else 'none')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html gallery.html .github/workflows/add-second-google-ads-tag.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add second Google Ads tracking tag"
            git push
          fi
