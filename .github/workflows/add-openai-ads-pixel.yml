name: Add OpenAI Ads measurement pixel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-openai-ads-pixel.yml

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add OpenAI Ads pixel and lead events
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          PIXEL_ID = "ASWYvC7c9ygeDn78fUwQf"

          PIXEL_SNIPPET = f"""  <!-- OpenAI Ads Measurement Pixel -->
  <script>
    (function (w, d, s, u) {{
      if (w.oaiq) return;
      var q = function () {{
        q.q.push(arguments);
      }};
      q.q = [];
      w.oaiq = q;
      var js = d.createElement(s);
      js.async = true;
      js.src = u;
      var f = d.getElementsByTagName(s)[0];
      f.parentNode.insertBefore(js, f);
    }})(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");
    oaiq("init", {{
      pixelId: "{PIXEL_ID}",
    }});
  </script>
"""

          OPENAI_HELPER = """  <script>
    function white5_report_openai_lead() {
      if (typeof oaiq === 'function') {
        oaiq("measure", "lead_created", {
          type: "customer_action"
        });
      }
    }
  </script>
"""

          def add_pixel(html):
            if PIXEL_ID in html or 'https://bzrcdn.openai.com/sdk/oaiq.min.js' in html:
              return html
            marker = '<meta name="viewport"'
            idx = html.find(marker)
            if idx != -1:
              return html[:idx] + PIXEL_SNIPPET + html[idx:]
            return html.replace('</head>', PIXEL_SNIPPET + '</head>', 1)

          def add_openai_helper(html):
            if 'function white5_report_openai_lead()' in html:
              return html
            if 'function white5_report_conversion_event()' in html:
              return html.replace('  function white5_report_conversion_event() {', OPENAI_HELPER + '\n  function white5_report_conversion_event() {', 1)
            return html.replace('</head>', OPENAI_HELPER + '</head>', 1)

          def add_openai_to_redirect_helper(html):
            if 'function gtag_report_conversion(url)' not in html:
              return html
            pattern = r'(function\s+gtag_report_conversion\s*\(url\)\s*\{)(?![\s\S]*?white5_report_openai_lead\(\))'
            return re.sub(pattern, r'\1\n    white5_report_openai_lead();', html, count=1)

          def update_inline_ctas(html):
            html = html.replace('white5_report_conversion_event(); white5_report_openai_lead();', 'white5_report_conversion_event();')
            html = html.replace('white5_report_conversion_event();', 'white5_report_conversion_event(); white5_report_openai_lead();')
            return html

          changed = []
          for path in Path('.').glob('*.html'):
            original = path.read_text(encoding='utf-8')
            updated = add_pixel(original)
            updated = add_openai_helper(updated)
            updated = add_openai_to_redirect_helper(updated)
            updated = update_inline_ctas(updated)
            if updated != original:
              path.write_text(updated, encoding='utf-8', newline='\n')
              changed.append(str(path))

          workflow = Path('.github/workflows/add-openai-ads-pixel.yml')
          if workflow.exists():
            workflow.unlink()
            changed.append(str(workflow))

          print('Changed files:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html gallery.html .github/workflows/add-openai-ads-pixel.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add OpenAI Ads measurement pixel"
            git push
          fi
