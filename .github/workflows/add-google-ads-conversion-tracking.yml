name: Add Google Ads conversion tracking

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-google-ads-conversion-tracking.yml

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Google Ads tracking
        shell: python
        run: |
          from pathlib import Path
          import re

          ADS_ID = "AW-17206495005"
          SEND_TO = "AW-17206495005/4T4mCJ7N-64cEJ2O2YxA"

          GOOGLE_TAG = """  <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17206495005"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'AW-17206495005');
          </script>
          """

          HELPER = """  <script>
            function gtag_report_conversion(url) {
              var callback = function () {
                if (typeof(url) !== 'undefined') {
                  window.location = url;
                }
              };

              gtag('event', 'conversion', {
                'send_to': 'AW-17206495005/4T4mCJ7N-64cEJ2O2YxA',
                'event_callback': callback
              });

              return false;
            }
          </script>
          """

          EVENT = "gtag('event', 'conversion', {'send_to': 'AW-17206495005/4T4mCJ7N-64cEJ2O2YxA'});"
          LEAD_HREFS = {'#quote', '#estimate', 'index.html#quote', 'services.html#quote', 'index.html#estimate', 'services.html#estimate'}

          def add_head_scripts(html):
            if f'googletagmanager.com/gtag/js?id={ADS_ID}' not in html:
              html = re.sub(r'(<meta\s+charset="UTF-8"\s*/?>\s*)', r'\1' + GOOGLE_TAG, html, count=1, flags=re.I)
            if 'function gtag_report_conversion(url)' not in html:
              html = html.replace('</head>', HELPER + '</head>', 1)
            return html

          def add_attr(attrs, addition):
            return '<a ' + addition + attrs.strip() + '>'

          def track_links(html):
            def repl(anchor):
              attrs = anchor.group(1)
              if 'onclick=' in attrs:
                return anchor.group(0)
              href_match = re.search(r'href="([^"]+)"', attrs)
              if not href_match:
                return anchor.group(0)
              href = href_match.group(1)
              if href.startswith('tel:'):
                return add_attr(attrs, f'onclick="return gtag_report_conversion(\'{href}\');" ')
              if href.startswith('https://wa.me/'):
                return add_attr(attrs, f'onclick="return gtag_report_conversion(\'{href}\');" ')
              if href in LEAD_HREFS:
                return add_attr(attrs, f'onclick="{EVENT}" ')
              return anchor.group(0)

            html = re.sub(r'<a\s+([^>]*?)>', repl, html, flags=re.I)
            html = html.replace('onclick="calculateEstimate()"', f'onclick="{EVENT} calculateEstimate()"')
            html = html.replace('onclick="openRequestModal()"', f'onclick="{EVENT} openRequestModal()"')
            html = html.replace('onclick="sendRequestEmail()"', f'onclick="{EVENT} sendRequestEmail()"')
            return html

          changed = []
          for path in Path('.').glob('*.html'):
            original = path.read_text(encoding='utf-8')
            updated = track_links(add_head_scripts(original))
            if updated != original:
              path.write_text(updated, encoding='utf-8', newline='\n')
              changed.append(str(path))

          workflow = Path('.github/workflows/add-google-ads-conversion-tracking.yml')
          if workflow.exists():
            workflow.unlink()
            changed.append(str(workflow))

          print('Changed files:', ', '.join(changed) if changed else 'none')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html gallery.html .github/workflows/add-google-ads-conversion-tracking.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Google Ads conversion tracking"
            git push
          fi
