name: Apply corrected White5 font to production

on:
  push:
    branches:
      - white5-font-production
    paths:
      - .github/workflows/apply-font-production.yml

permissions:
  contents: write

jobs:
  apply-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production font branch
        uses: actions/checkout@v4
        with:
          ref: white5-font-production
          fetch-depth: 0

      - name: Copy corrected font from tested branch
        run: |
          git fetch origin white5-deck-fence-leads --depth=1
          git show FETCH_HEAD:'White5-Regular Font.ttf' > 'White5-Regular Font.ttf'

      - name: Refresh font references on every site page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"White5-Regular Font\.ttf(?:\?v=[^'\"\)\s]+)?")
          replacement = "White5-Regular Font.ttf?v=001002"

          for extension in ("*.html", "*.htm", "*.css", "*.js"):
              for path in Path(".").rglob(extension):
                  if ".git" in path.parts:
                      continue
                  text = path.read_text(encoding="utf-8")
                  updated = pattern.sub(replacement, text)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/apply-font-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update corrected White5 font across production site"
          git push origin HEAD:white5-font-production
