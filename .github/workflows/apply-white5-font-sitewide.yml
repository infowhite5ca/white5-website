name: Apply White5 font sitewide

on:
  push:
    branches:
      - white5-deck-fence-leads
    paths:
      - tools/apply_white5_font_sitewide.py
      - .github/workflows/apply-white5-font-sitewide.yml

permissions:
  contents: write

jobs:
  update-font-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: white5-deck-fence-leads
          fetch-depth: 0

      - name: Update every site font reference
        run: python tools/apply_white5_font_sitewide.py

      - name: Remove one-time helper files
        run: |
          rm -f tools/apply_white5_font_sitewide.py
          rm -f .github/workflows/apply-white5-font-sitewide.yml

      - name: Commit sitewide font refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use corrected White5 font across the site"
          git push origin HEAD:white5-deck-fence-leads
